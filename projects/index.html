<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050607">
  <title>Project — Zero</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("zero-portfolio-theme")||"dark"}catch{}</script>
  <link rel="icon" href="/img/icon.webp">
  <link rel="stylesheet" href="/portfolio.css">
</head>
<body data-page="project">
  <header class="site-header scrolled project-page-header">
    <a class="brand" href="/">
      <strong data-detail-name>零</strong>
      <small>GAME DEVELOPER</small>
    </a>
    <span></span>
    <label class="language">
      <span class="sr-only">Language</span>
      <select id="locale-select" aria-label="Language">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">簡體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </header>

  <main class="project-detail">
    <a class="project-back" href="/#works">← <span data-detail-back>返回項目</span></a>
    <article class="project-detail-shell">
      <div class="project-detail-media" data-project-media>
        <img alt=""><video muted loop playsinline preload="none" aria-hidden="true"></video>
        <div class="project-detail-hero-overlay">
          <span class="commercial-year" data-project-year></span>
          <h1 data-project-name></h1>
          <p class="project-detail-genre-line" data-project-genres></p>
        </div>
      </div>
      <div class="project-detail-content">
        <header class="project-detail-heading">
          <h1 data-project-name></h1>
          <p class="project-detail-genre-line" data-project-genres></p>
        </header>
        <section class="project-detail-overview">
          <h2 data-detail-overview></h2>
          <div class="project-detail-meta" data-project-meta></div>
        </section>
        <section class="project-detail-story">
          <h2 data-detail-intro></h2>
          <p data-project-intro></p>
        </section>
        <section class="project-detail-responsibility">
          <h2 data-detail-role></h2>
          <ul data-project-role></ul>
        </section>
        <section class="project-detail-achievements" data-project-achievements-section hidden>
          <h2 data-detail-achievements></h2>
          <div class="project-achievement-grid" data-project-achievements></div>
        </section>
        <section class="project-detail-gallery" data-project-gallery-section hidden>
          <h2 data-detail-gallery></h2>
          <div class="project-gallery-grid" data-project-gallery></div>
        </section>
        <section class="project-detail-external" data-project-links-section hidden>
          <h2 data-detail-external-links></h2>
          <div class="project-detail-links" data-project-links role="navigation" aria-label="Project links"></div>
        </section>
        <div class="project-detail-navigation" data-project-navigation role="navigation" aria-label="Project navigation">
          <a class="project-detail-next is-previous" data-project-previous>
            <small data-detail-previous></small><span aria-hidden="true"></span><strong data-project-previous-name></strong>
          </a>
          <a class="project-detail-next" data-project-next>
            <small data-detail-next></small><strong data-project-next-name></strong><span aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </article>
  </main>

  <dialog class="project-lightbox" data-project-lightbox aria-label="Media viewer">
    <button type="button" class="project-lightbox-nav" data-lightbox-prev aria-label="Previous">‹</button>
    <div class="project-lightbox-media" data-lightbox-stage>
      <img alt="" hidden>
      <video controls playsinline hidden></video>
    </div>
    <button type="button" class="project-lightbox-nav" data-lightbox-next aria-label="Next">›</button>
    <button type="button" class="project-lightbox-close" data-lightbox-close aria-label="Close"></button>
    <span class="project-lightbox-counter" data-lightbox-counter></span>
  </dialog>

  <div class="project-popup-scrollbar" aria-hidden="true"><i></i></div>
  <script src="/portfolio.js"></script>
  <script src="/project-page.js"></script>
</body>
</html>
